# CI for bs-sandbox/factory-sandbox: the required "ci" check.
#
# The factory needs CI green on a PR's head commit before Code Review (policy
# guard ci_green; "no checks" counts as not green), and the ruleset requires
# this check. It also runs on merge_group: the merge queue tests a temporary
# merge commit, and a required check that never reports there stalls the queue.
#
# The contract every change must keep (the Architect designs to it), plus QA's
# acceptance tests in tests/acceptance/ (their own package; run when present):
#   npm ci          installs exactly what package-lock.json pins
#   npm test        runs the tests (node --test unless the design changes it)
#   npm run build   writes the static site to dist/, with dist/index.html
# pages.yml publishes the same dist/ to GitHub Pages after a merge.
#
# Actions are GitHub's own, pinned to the commit of the release named beside
# each (looked up 2026-10-20). Update the SHA and the comment together.
name: ci
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # Install scripts don't run: dependencies are code an agent chose.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: The build produced the site
        run: test -s dist/index.html || { echo "npm run build must write dist/index.html"; exit 1; }
      # QA's acceptance tests (2026-10-20: CI never ran them, so QA had no CI run
      # to cite as Test Evidence). Their own package: Playwright and its Chromium.
      - name: Acceptance tests - install dependencies
        if: hashFiles('tests/acceptance/package-lock.json') != ''
        working-directory: tests/acceptance
        run: npm ci --ignore-scripts
      # Browser only, no --with-deps: no apt, no Ubuntu mirror (LIV-44).
      - name: Acceptance tests - Playwright browser cache
        id: pw-cache
        if: hashFiles('tests/acceptance/package-lock.json') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/acceptance/package-lock.json') }}
      - name: Acceptance tests - install browser
        if: hashFiles('tests/acceptance/package-lock.json') != ''
        working-directory: tests/acceptance
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Acceptance tests
        if: hashFiles('tests/acceptance/package-lock.json') != ''
        working-directory: tests/acceptance
        run: npx playwright test
